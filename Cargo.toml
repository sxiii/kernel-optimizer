[package]
name = "kernel-optimizer"
version = "0.1.0"
edition = "2024"
description = "Inspect hardware, compare Linux kernel variants, and build a tuned kernel safely"
license = "MIT"

[[bin]]
name = "kernel-optimizer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
regex = "1"
libc = "0.2"

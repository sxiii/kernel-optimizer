[package]
name = "kernel-optimizer"
version = "0.2.0"
edition = "2024"
description = "Inspect hardware, compare Linux kernel variants, and tune Linux safely"
license = "MIT"

[[bin]]
name = "kernel-optimizer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
regex = "1"
libc = "0.2"
ratatui = "0.30.2"
crossterm = "0.29"
sha2 = "0.10"

# Native desktop interface (OpenGL renderer) and native file pickers.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.18.0"

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libwayland-dev libegl1-mesa-dev libdbus-1-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  shell:
    name: ShellCheck and shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check shell scripts when present
        shell: bash
        run: |
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (("${#scripts[@]}" > 0)); then
            shellcheck "${scripts[@]}"
            shfmt -d "${scripts[@]}"
          else
            echo "No shell scripts found; Rust checks cover the application."
          fi

  arch-package-integration:
    name: Arch package build integration
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clean Arch build environment
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \\
            base-devel rust cargo mkinitcpio kmod \\
            libxcb libx11 libxi libxrandr libxinerama libxcursor \\
            libxkbcommon libxkbcommon-x11 wayland dbus mesa libglvnd pkgconf
      - name: Create an unprivileged package builder
        run: |
          useradd --create-home --uid 1001 builder
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
      - name: Build and inspect a pacman package from staged test artifacts
        run: |
          runuser -u builder -- env \\
            HOME=/home/builder \\
            CARGO_HOME=/home/builder/.cargo \\
            KERNEL_OPTIMIZER_RUN_ARCH_PACKAGE_INTEGRATION=1 \\
            cargo test --all-targets arch_package::tests::arch_package_build_smoke_in_clean_environment -- --exact --nocapture
